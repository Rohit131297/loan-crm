<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan CRM</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.hidden{display:none!important}.app{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:linear-gradient(180deg,#13233d,#0d1a2f);color:#fff;padding:18px 10px;overflow:hidden;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:700;padding:8px 10px 22px;border-bottom:1px solid #ffffff22;margin-bottom:14px}.brand span{font-size:25px;margin-right:8px}.nav{flex:1;min-height:0;overflow-y:auto;padding-right:2px}.nav button,.logout button{display:flex;width:100%;border:0;background:transparent;color:#eef4ff;padding:11px;border-radius:8px;margin:3px 0;text-align:left;cursor:pointer;gap:11px;font-size:14px}.nav button:hover,.nav .active{background:#1769d3}.logout{position:static;flex:none;margin-top:12px;border-top:1px solid #ffffff22;padding-top:12px}.main{margin-left:235px;padding:24px;flex:1}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:26px}.muted{color:#778195;font-size:13px}.card{background:#fff;border:1px solid #e9edf3;border-radius:12px;padding:18px;box-shadow:0 5px 18px #1720330b;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stat{min-height:110px}.stat b{display:block;font-size:24px;margin-top:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.wide{grid-column:span 2}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form label{font-size:12px;color:#667085}.form input,.form select,.form textarea,.search input,.search select{width:100%;padding:10px;margin-top:5px;border:1px solid #dfe4eb;border-radius:7px}.form textarea{min-height:80px}.btn{border:0;border-radius:7px;padding:10px 14px;background:#1769d3;color:#fff;cursor:pointer;margin-top:14px}.search{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px;white-space:nowrap}.badge{padding:4px 7px;border-radius:12px;background:#eef4ff;color:#1769d3}.donut{width:135px;height:135px;border-radius:50%;background:conic-gradient(#3182ed 0 37%,#55b96b 37% 57%,#ff9d18 57% 78%,#9556d9 78% 91%,#ed5b5b 91% 100%);position:relative;flex:none}.donut:after{content:'Leads';position:absolute;inset:32px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:700}.split{display:flex;gap:25px;align-items:center}.quick{display:grid;gap:9px}.quick button{border:1px solid #e7ebf1;background:#fff;padding:11px;border-radius:7px;text-align:left;color:#1769d3;cursor:pointer}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{padding:16px;border-radius:10px;background:#f7faff}.login{max-width:420px;margin:12vh auto}.login input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}.login .btn{width:100%}.danger{background:#b91c1c}.link{color:#1769d3;cursor:pointer}@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}}@media(max-width:700px){.side{width:70px}.brand{font-size:0}.brand span{font-size:25px}.nav button span:last-child,.logout span:last-child{display:none}.main{margin-left:70px;padding:14px}.stats,.grid3,.form,.summary{grid-template-columns:1fr}.wide{grid-column:span 1}.search{grid-template-columns:1fr}}
</style></head><body><div id="login" class="card login"><h2>Loan CRM Login</h2><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Login</button><p id="msg" class="muted"></p></div><div id="app" class="app hidden"><aside class="side"><div class="brand"><span>🏢</span>Loan CRM</div><div class="nav"><button class="active" onclick="page('dashboard',this)"><span>▦</span><span>Dashboard</span></button><button onclick="page('leadCreate',this)"><span>＋</span><span>Lead Create</span></button><button onclick="page('leads',this)"><span>♧</span><span>Leads</span></button><button onclick="page('payout',this)"><span>◉</span><span>Payout & Connector Payment</span></button><button onclick="page('history',this)"><span>▣</span><span>Payout History</span></button><button onclick="page('connectors',this)"><span>♧</span><span>Connectors</span></button><button onclick="page('users',this)"><span>♙</span><span>Users</span></button><button onclick="page('reports',this)"><span>▥</span><span>Reports</span></button><button onclick="page('settings',this)"><span>⚙</span><span>Settings</span></button><button onclick="page('profile',this)"><span>♙</span><span>Profile</span></button></div><div class="logout"><button onclick="logout()"><span>⇥</span><span>Logout</span></button></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><p class="muted">Welcome back, <b id="welcome">Rohit Mohite</b></p></div><div class="card" style="margin:0;min-width:170px">👤 <b id="topuser">Rohit Mohite</b><br><span class="muted" id="toprole">Admin</span></div></div><div id="view"></div></main></div><script>const API='/api';let token=localStorage.getItem('crm_token')||'',role='',me='';const $=id=>document.getElementById(id),money=x=>'₹'+Number(x||0).toLocaleString('en-IN',{maximumFractionDigits:2});async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(API+path,opt),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{let d=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})}).then(r=>r.json());if(!d.token)throw Error(d.error||'Login failed');token=d.token;role=d.role;me=d.username;localStorage.setItem('crm_token',token);showApp();dashboard()}catch(e){$('msg').textContent=e.message}}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent=me;$('topuser').textContent=me;$('toprole').textContent=role;if(role!=='admin')$('assignWrap')?.classList.add('hidden')}function logout(){localStorage.removeItem('crm_token');location.reload()}function page(n,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');let names={leadCreate:'Lead Create',payout:'Payout & Connector Payment',history:'Payout History'};$('title').textContent=names[n]||n[0].toUpperCase()+n.slice(1);({dashboard,leadCreate,leads,payout,history,connectors,users,reports,settings,profile}[n])()}async function dashboard(){try{let d=await api('/dashboard');$('view').innerHTML=`<div class="stats"><div class="card stat"><small>Total Leads</small><b>${d.total}</b><span class="muted">All Leads</span></div><div class="card stat"><small>New Leads</small><b>${d.counts.New||0}</b><span class="muted">This Period</span></div><div class="card stat"><small>Login</small><b>${d.counts.Login||0}</b><span class="muted">This Period</span></div><div class="card stat"><small>Sanction</small><b>${d.counts.Sanction||0}</b><span class="muted">This Period</span></div><div class="card stat"><small>Disbursed</small><b>${d.counts.Disbursed||0}</b><span class="muted">This Period</span></div><div class="card stat"><small>Total Payout</small><b>${money(d.payout)}</b><span class="muted">This Period</span></div></div><div class="grid3"><div class="card"><h3>Product Wise Leads</h3><div class="split"><div class="donut"></div><div>Home Loan <b>37%</b><br><br>Mortgage Loan <b>20%</b><br><br>Personal Loan <b>21%</b><br><br>Business Loan <b>13%</b><br><br>Car Loan <b>9%</b></div></div></div><div class="card"><h3>Status Wise Leads</h3><div class="split"><div class="donut"></div><div>New: ${d.counts.New||0}<br><br>Login: ${d.counts.Login||0}<br><br>Sanction: ${d.counts.Sanction||0}<br><br>Disbursed: ${d.counts.Disbursed||0}<br><br>Rejected: ${d.counts.Rejected||0}</div></div></div><div class="card"><h3>Quick Actions</h3><div class="quick"><button onclick="page('leadCreate',document.querySelectorAll('.nav button')[1])">＋ Add New Lead</button><button onclick="page('payout',document.querySelectorAll('.nav button')[3])">◉ Payout & Payment</button><button onclick="page('history',document.querySelectorAll('.nav button')[4])">▣ Payout History</button><button onclick="page('connectors',document.querySelectorAll('.nav button')[5])">♧ Add / View Connectors</button></div></div></div><div class="grid3"><div class="card wide"><h3>Disbursement Summary</h3><div class="summary"><div class="mini">Total Disbursement<br><b>${money(d.disbursement)}</b></div><div class="mini">Total Payout<br><b>${money(d.payout)}</b></div><div class="mini">Pending Payout<br><b>${money(d.pending)}</b></div><div class="mini">Disbursed Leads<br><b>${d.counts.Disbursed||0}</b></div></div></div><div class="card"><h3>This Month Summary</h3><div class="summary"><div class="mini">Leads<br><b>${d.total}</b></div><div class="mini">Disbursement<br><b>${money(d.disbursement)}</b></div><div class="mini">Payout<br><b>${money(d.payout)}</b></div><div class="mini">Pending<br><b>${money(d.pending)}</b></div></div></div></div>`}catch(e){$('view').innerHTML='<div class="card">Unable to load dashboard: '+safe(e.message)+'</div>'}}function field(id,label,type='text'){return `<label>${label}<input id="${id}" type="${type}"></label>`}function leadCreate(){ $('view').innerHTML=`<div class="card"><h2>Create / Update Lead</h2><input type="hidden" id="id"><div class="form">${field('customer','Customer Name')}${field('lmob','Mobile')}${field('email','Email')}<label>Product<select id="product"><option value="">Select Product</option><option>Home Loan</option><option>Mortgage Loan</option><option>Personal Loan</option><option>Business Loan</option><option>Car Loan</option></select></label><label>Bank / NBFC Type<select id="bank_type"><option>Bank</option><option>NBFC</option></select></label>${field('bank','Bank / NBFC Name')}${field('banker','Banker')}${field('connector','Connector')}${field('appno','Application Number')}${field('loan_account','Loan Account Number')}<label>Status<select id="status"><option>New</option><option>Login</option><option>Sanction</option><option>Disbursed</option><option>Rejected</option></select></label>${field('loan_amount','Loan Amount','number')}${field('sanction_amount','Sanction Amount','number')}${field('disb','Actual Disbursement Amount','number')}${field('follow_date','Next Follow-up','date')}<label id="assignWrap">Assigned Sales Executive<select id="assigned_to"><option value="">Unassigned</option></select></label><label style="grid-column:1/-1">Remark<textarea id="remark"></textarea></label></div><button class="btn" onclick="saveLead()">Save / Update Lead</button></div>`;if(role==='admin')loadUsers();else $('assignWrap').classList.add('hidden')}async function saveLead(){let b={id:$('id').value||undefined,customer:$('customer').value,mobile:$('lmob').value,email:$('email').value,product:$('product').value,bank_type:$('bank_type').value,bank:$('bank').value,banker:$('banker').value,connector:$('connector').value,appno:$('appno').value,loan_account:$('loan_account').value,status:$('status').value,loan_amount:+$('loan_amount').value||0,sanction_amount:+$('sanction_amount').value||0,disb:+$('disb').value||0,follow_date:$('follow_date').value,remark:$('remark').value,assigned_to:role==='admin'?$('assigned_to').value:''};let path=b.id?'/leads/'+b.id:'/leads',method=b.id?'PUT':'POST';try{await api(path,{method,body:JSON.stringify(b)});alert(b.id?'Lead updated':'Lead created');page('leads',document.querySelectorAll('.nav button')[2])}catch(e){alert(e.message)}}async function loadUsers(){try{let a=await api('/users');if($('assigned_to'))$('assigned_to').innerHTML='<option value="">Unassigned</option>'+a.filter(u=>u.role==='sales').map(u=>`<option value="${safe(u.username)}">${safe(u.username)}</option>`).join('');if($('userRows'))$('userRows').innerHTML=a.map(u=>`<tr><td>${safe(u.username)}</td><td>${safe(u.role)}</td><td>${safe(u.created_at)}</td><td>${u.id!==1?`<button class="danger" onclick="deleteUser(${u.id})">Delete</button>`:'Admin'}</td></tr>`).join('')}catch(e){}}async function leads(status){let p=new URLSearchParams(),s=status!==undefined?status:($('fs')?.value||'');if(s)p.set('status',s);if($('q')?.value)p.set('q',$('q').value);if($('fc')?.value)p.set('connector',$('fc').value);let a=await api('/leads?'+p);$('view').innerHTML=`<div class="card"><h2>Leads</h2><div class="search"><input id="q" placeholder="Search name/mobile/application" value="${safe($('q')?.value||'')}"><select id="fs"><option value="">All Status</option><option>New</option><option>Login</option><option>Sanction</option><option>Disbursed</option><option>Rejected</option></select><input id="fc" placeholder="Connector"></div><button class="btn" onclick="leads()">Search</button><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Product</th><th>Bank/NBFC</th><th>Mobile</th><th>Application</th><th>Status</th><th>Loan Amt</th><th>Disbursed</th><th>Assigned</th><th>Action</th></tr></thead><tbody>${a.map(x=>`<tr><td class="link" onclick='edit(${JSON.stringify(x)})'>${safe(x.customer)}</td><td>${safe(x.product)}</td><td>${safe(x.bank_type)} / ${safe(x.bank)}</td><td>${safe(x.mobile)}</td><td>${safe(x.appno)}</td><td><span class="badge">${safe(x.status)}</span></td><td>${money(x.loan_amount)}</td><td>${money(x.disb)}</td><td>${safe(x.assigned_to)}</td><td><button onclick='edit(${JSON.stringify(x)})'>Open</button> <button onclick="changeStatus('${x.id}')">Status</button></td></tr>`).join('')||'<tr><td colspan="10">No leads</td></tr>'}</tbody></table></div></div>`}function edit(x){page('leadCreate',document.querySelectorAll('.nav button')[1]);setTimeout(()=>{['id','customer','email','product','bank_type','bank','banker','connector','appno','loan_account','status','loan_amount','sanction_amount','disb','follow_date','remark','assigned_to'].forEach(k=>{if($(k))$(k).value=x[k]??''});$('lmob').value=x.mobile||''},50)}async function changeStatus(id){let s=prompt('New status: New, Login, Sanction, Disbursed or Rejected');if(!s)return;let v=['New','Login','Sanction','Disbursed','Rejected'].find(x=>x.toLowerCase()===s.toLowerCase());if(!v)return alert('Invalid status');await api('/leads/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:v})});leads()}async function payout(){let a=await api('/leads?status=Disbursed');$('view').innerHTML=`<div class="card"><h2>Payout & Connector Payment</h2><div class="form"><label>Disbursed Lead<select id="plead" onchange="fillPay()"><option value="">Select</option>${a.map(x=>`<option value="${x.id}">${safe(x.customer)} - ${safe(x.appno)}</option>`).join('')}</select></label>${field('pconnector','Connector')}${field('pamount','Disbursement')}${field('ppercent','Payout %','number')}${field('pnet','Net Payout')}${field('pdate','Payment Date','date')}<label>Mode<select id="pmode"><option>Bank Transfer</option><option>UPI</option><option>Cash</option></select></label>${field('putr','UTR')}<label>Status<select id="pstatus"><option>Pending</option><option>Paid</option></select></label></div><button class="btn" onclick="savePayment()">Save Payout & Payment</button></div>`}async function fillPay(){let a=await api('/leads?status=Disbursed'),x=a.find(x=>String(x.id)===$('plead').value);if(x){$('pconnector').value=x.connector||'';$('pamount').value=x.disb||0;calc()}}function calc(){if($('pnet'))$('pnet').value=(Number($('pamount')?.value||0)*Number($('ppercent')?.value||0)/100).toFixed(2)}async function savePayment(){if(!$('plead').value)return alert('Select a lead');let data={lead_id:$('plead').value,connector:$('pconnector').value,payout_percent:+$('ppercent').value||0,payment_date:$('pdate').value,payment_mode:$('pmode').value,utr:$('putr').value,payment_status:$('pstatus').value};await api('/payments',{method:'POST',body:JSON.stringify(data)});alert('Payment saved');history()}async function history(){let a=await api('/payments');$('view').innerHTML=`<div class="card"><h2>Payout History</h2><div style="overflow:auto"><table><thead><tr><th>Customer</th><th>Connector</th><th>%</th><th>Net Payout</th><th>Date</th><th>Mode</th><th>UTR</th><th>Status</th></tr></thead><tbody>${a.map(x=>`<tr><td>${safe(x.customer||'')}</td><td>${safe(x.connector)}</td><td>${x.payout_percent}%</td><td>${money(x.net_payout)}</td><td>${safe(x.payment_date||'-')}</td><td>${safe(x.payment_mode)}</td><td>${safe(x.utr)}</td><td><span class="badge">${safe(x.payment_status)}</span></td></tr>`).join('')||'<tr><td colspan="8">No payment history</td></tr>'}</tbody></table></div></div>`}async function connectors(){let a=await api('/leads'),m={};a.forEach(x=>{let c=x.connector||'Unassigned';if(!m[c])m[c]={total:0,disb:0};m[c].total++;if(x.status==='Disbursed')m[c].disb++});$('view').innerHTML=`<div class="card"><h2>Connectors</h2><table><thead><tr><th>Connector</th><th>Total Leads</th><th>Disbursed</th></tr></thead><tbody>${Object.entries(m).map(([k,v])=>`<tr><td>${safe(k)}</td><td>${v.total}</td><td>${v.disb}</td></tr>`).join('')||'<tr><td colspan="3">No connectors found</td></tr>'}</tbody></table></div>`}async function users(){if(role!=='admin')return $('view').innerHTML='<div class="card"><h2>Users</h2><p>Admin access required.</p></div>';let a=await api('/users');$('view').innerHTML=`<div class="card"><h2>Users</h2><div class="form"><input id="newuser" placeholder="Username"><input id="newpass" type="password" placeholder="Temporary password"><select id="newrole"><option value="sales">Sales Executive</option><option value="admin">Admin</option></select></div><button class="btn" onclick="addUser()">Add User</button><table><thead><tr><th>Username</th><th>Role</th><th>Created</th><th>Action</th></tr></thead><tbody id="userRows">${a.map(u=>`<tr><td>${safe(u.username)}</td><td>${safe(u.role)}</td><td>${safe(u.created_at)}</td><td>${u.id!==1?`<button class="danger" onclick="deleteUser(${u.id})">Delete</button>`:'Primary Admin'}</td></tr>`).join('')}</tbody></table></div>`}async function addUser(){let username=$('newuser').value.trim(),password=$('newpass').value;if(!username||!password)return alert('Username and password required');await api('/users',{method:'POST',body:JSON.stringify({username,password,role:$('newrole').value})});users()}async function deleteUser(id){if(confirm('Delete this user?')){await api('/users/'+id,{method:'DELETE'});users()}}async function reports(){let d=await api('/dashboard');$('view').innerHTML=`<div class="card"><h2>Reports</h2><div class="stats"><div class="card stat"><small>Total Leads</small><b>${d.total}</b></div><div class="card stat"><small>Login</small><b>${d.counts.Login||0}</b></div><div class="card stat"><small>Sanction</small><b>${d.counts.Sanction||0}</b></div><div class="card stat"><small>Disbursed</small><b>${d.counts.Disbursed||0}</b></div><div class="card stat"><small>Disbursement</small><b>${money(d.disbursement)}</b></div><div class="card stat"><small>Payout</small><b>${money(d.payout)}</b></div></div></div>`}function settings(){$('view').innerHTML=`<div class="card"><h2>Settings</h2><p>CRM Settings</p><label>Dashboard Refresh</label><select style="max-width:300px;padding:10px"><option>Manual</option><option>On Login</option></select><p class="muted">Your existing CRM data and login settings are preserved.</p></div>`}function profile(){$('view').innerHTML=`<div class="card"><h2>Profile</h2><div class="form"><label>Username<input value="${safe(me)}" readonly></label><label>Role<input value="${safe(role)}" readonly></label></div></div>`}function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(token){api('/me').then(d=>{role=d.role;me=d.username;showApp();dashboard()}).catch(()=>logout())}</script></body></html>
