<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan CRM</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.hidden{display:none!important}.app{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:220px;background:linear-gradient(180deg,#13233d,#0d1a2f);color:#fff;padding:18px 10px}.brand{font-size:19px;font-weight:700;padding:8px 10px 22px;border-bottom:1px solid #ffffff20;margin-bottom:14px}.nav button{display:flex;width:100%;border:0;background:transparent;color:#eef4ff;padding:11px;border-radius:8px;margin:3px 0;text-align:left;cursor:pointer;gap:11px}.nav button:hover,.nav .active{background:#1769d3}.logout{position:absolute;bottom:18px;left:10px;right:10px;border-top:1px solid #ffffff20;padding-top:14px}.main{margin-left:220px;padding:24px;flex:1}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:26px}.muted{color:#778195;font-size:13px}.card{background:#fff;border:1px solid #e9edf3;border-radius:12px;padding:18px;box-shadow:0 5px 18px #1720330b}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}.stat b{display:block;font-size:24px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.wide{grid-column:span 2}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form label{font-size:12px;color:#667085}.form input,.form select,.form textarea,.search input,.search select{width:100%;padding:10px;margin-top:5px;border:1px solid #dfe4eb;border-radius:7px}.form textarea{min-height:80px}.btn{border:0;border-radius:7px;padding:10px 14px;background:#1769d3;color:#fff;cursor:pointer;margin-top:14px}.search{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px;white-space:nowrap}.badge{padding:4px 7px;border-radius:12px;background:#eef4ff;color:#1769d3}.rowbtn{padding:5px 8px;border:0;border-radius:5px;background:#1769d3;color:#fff;cursor:pointer}.donut{width:130px;height:130px;border-radius:50%;background:conic-gradient(#3182ed 0 37%,#55b96b 37% 57%,#ff9d18 57% 78%,#9556d9 78% 91%,#ed5b5b 91% 100%);position:relative}.donut:after{content:'CRM';position:absolute;inset:30px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:700}.split{display:flex;gap:25px;align-items:center}.quick{display:grid;gap:9px}.quick button{border:1px solid #e7ebf1;background:#fff;padding:11px;border-radius:7px;text-align:left;color:#1769d3;cursor:pointer}.login{max-width:400px;margin:12vh auto}.login input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}.login .btn{width:100%}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.form{grid-template-columns:1fr 1fr}}@media(max-width:700px){.side{width:70px}.brand{font-size:0}.nav button span:last-child,.logout span:last-child{display:none}.main{margin-left:70px;padding:14px}.stats,.grid,.form{grid-template-columns:1fr}.wide{grid-column:span 1}.search{grid-template-columns:1fr}} </style></head><body><div id="login" class="card login"><h2>Loan CRM Login</h2><input id="mobile" value="7972048818"><button class="btn" onclick="otp()">Send OTP</button><div id="otpbox" class="hidden"><input id="code" placeholder="Enter OTP"><button class="btn" onclick="verify()">Verify OTP</button></div><p id="msg" class="muted"></p></div><div id="app" class="app hidden"><aside class="side"><div class="brand">🏢 Loan CRM</div><div class="nav"><button onclick="page('dashboard',this)" class="active"><span>▦</span><span>Dashboard</span></button><button onclick="page('leadCreate',this)"><span>＋</span><span>Lead Create</span></button><button onclick="page('leads',this)"><span>♧</span><span>Leads</span></button><button onclick="page('payout',this)"><span>◉</span><span>Payout & Connector Payment</span></button><button onclick="page('history',this)"><span>▣</span><span>Payout History</span></button><button onclick="page('connectors',this)"><span>♧</span><span>Connectors</span></button><button onclick="page('users',this)"><span>♙</span><span>Users</span></button><button onclick="page('reports',this)"><span>▥</span><span>Reports</span></button><button onclick="page('settings',this)"><span>⚙</span><span>Settings</span></button><button onclick="page('profile',this)"><span>♙</span><span>Profile</span></button></div><div class="logout"><button onclick="logout()">⇥ <span>Logout</span></button></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><p class="muted">Welcome back, Rohit Mohite</p></div><div class="card">👤 <b>Rohit Mohite</b><br><span class="muted">Admin</span></div></div><div id="view"></div></main></div><script>const A='/api';let token=localStorage.getItem('crm_token')||'';const $=id=>document.getElementById(id),money=x=>'₹'+Number(x||0).toLocaleString('en-IN');async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(A+p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function otp(){let r=await fetch(A+'/auth/request-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile:$('mobile').value})});let d=await r.json();$('msg').textContent=d.message||d.error||'';$('otpbox').classList.remove('hidden')}async function verify(){let r=await fetch(A+'/auth/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mobile:$('mobile').value,otp:$('code').value})});let d=await r.json();if(!d.token)return $('msg').textContent=d.error||'OTP failed';token=d.token;localStorage.setItem('crm_token',token);start()}function logout(){localStorage.removeItem('crm_token');location.reload()}function page(n,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('title').textContent=n==='leadCreate'?'Lead Create':n==='payout'?'Payout & Connector Payment':n==='history'?'Payout History':n[0].toUpperCase()+n.slice(1);({dashboard,leadCreate,leads,payout,history,connectors,users,reports,settings,profile}[n])()}async function dashboard(){let d=await api('/dashboard');$('view').innerHTML=`<div class="stats"><div class="card">Total Leads<b>${d.total}</b></div><div class="card">New Leads<b>${d.counts.New}</b></div><div class="card">Login<b>${d.counts.Login}</b></div><div class="card">Sanction<b>${d.counts.Sanction}</b></div><div class="card">Disbursed<b>${d.counts.Disbursed}</b></div><div class="card">Total Payout<b>${money(d.payout)}</b></div></div><div class="grid"><div class="card"><h3>Product Wise Leads</h3><div class="split"><div class="donut"></div><div>Home Loan <b>37%</b><br><br>Mortgage Loan <b>20%</b><br><br>Personal Loan <b>21%</b><br><br>Business Loan <b>13%</b></div></div></div><div class="card"><h3>Status Wise Leads</h3><div class="split"><div class="donut"></div><div>New: ${d.counts.New}<br><br>Login: ${d.counts.Login}<br><br>Sanction: ${d.counts.Sanction}<br><br>Disbursed: ${d.counts.Disbursed}<br><br>Rejected: ${d.counts.Rejected}</div></div></div><div class="card"><h3>Quick Actions</h3><div class="quick"><button onclick="page('leadCreate',document.querySelectorAll('.nav button')[1])">＋ Add New Lead</button><button onclick="page('payout',document.querySelectorAll('.nav button')[3])">◉ Payout & Payment</button><button onclick="page('history',document.querySelectorAll('.nav button')[4])">▣ Payout History</button></div></div></div>`}function leadCreate(){ $('view').innerHTML=`<div class="card"><h3>Create / Update Lead</h3><div class="form">${field('customer','Customer Name')}${field('mobile','Mobile')}${field('email','Email')}${field('banker','Banker')}${field('connector','Connector')}${field('bank','Bank / NBFC')}${field('appno','Application Number')}${field('loan_account','Loan Account Number')}<label>Status<select id="status"><option>New</option><option>Login</option><option>Sanction</option><option>Disbursed</option><option>Rejected</option></select></label>${field('loan_amount','Loan Amount','number')}${field('sanction_amount','Sanction Amount','number')}${field('disb','Actual Disbursement','number')}${field('follow_date','Next Follow-up','date')}<label>Remark<textarea id="remark"></textarea></label></div><button class="btn" onclick="saveLead()">Save Lead</button></div>`}function field(id,label,type='text'){return `<label>${label}<input id="${id}" type="${type}"></label>`}async function saveLead(){let b={customer:$('customer').value,mobile:$('mobile').value,email:$('email').value,banker:$('banker').value,connector:$('connector').value,bank:$('bank').value,appno:$('appno').value,loan_account:$('loan_account').value,status:$('status').value,loan_amount:+$('loan_amount').value||0,sanction_amount:+$('sanction_amount').value||0,disb:+$('disb').value||0,follow_date:$('follow_date').value,remark:$('remark').value};await api('/leads',{method:'POST',body:JSON.stringify(b)});alert('Lead created');leads()}async function leads(){let a=await api('/leads');$('view').innerHTML=`<div class="card"><h3>Leads</h3><div class="search"><input id="q" placeholder="Search name/mobile/application"><select id="fs"><option value="">All Status</option><option>New</option><option>Login</option><option>Sanction</option><option>Disbursed</option><option>Rejected</option></select><input id="fc" placeholder="Connector"></div><button class="btn" onclick="filterLeads()">Search</button><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Mobile</th><th>Application</th><th>Status</th><th>Loan</th><th>Disbursed</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.customer)}</td><td>${esc(x.mobile)}</td><td>${esc(x.appno)}</td><td><span class="badge">${x.status}</span></td><td>${money(x.loan_amount)}</td><td>${money(x.disb)}</td></tr>`).join('')}</tbody></table></div></div>`}async function filterLeads(){let q=$('q').value,s=$('fs').value,c=$('fc').value;let a=await api('/leads?'+new URLSearchParams({q,status:s,connector:c}));let body=a.map(x=>`<tr><td>${esc(x.customer)}</td><td>${esc(x.mobile)}</td><td>${esc(x.appno)}</td><td><span class="badge">${x.status}</span></td><td>${money(x.loan_amount)}</td><td>${money(x.disb)}</td></tr>`).join('');document.querySelector('tbody').innerHTML=body}async function payout(){let a=await api('/leads?status=Disbursed');$('view').innerHTML=`<div class="card"><h3>Payout & Connector Payment</h3><div class="form"><label>Disbursed Lead<select id="plead">${a.map(x=>`<option value="${x.id}" data-amount="${x.disb}" data-con="${esc(x.connector)}">${esc(x.customer)} - ${esc(x.appno)}</option>`).join('')}</select></label>${field('ppercent','Payout %','number')}${field('pdate','Payment Date','date')}${field('putr','UTR')}${field('pconnector','Connector')}${field('pamount','Disbursement')}<label>Mode<select id="pmode"><option>Bank Transfer</option><option>UPI</option><option>Cash</option></select></label><label>Status<select id="pstatus"><option>Pending</option><option>Paid</option></select></label></div><button class="btn" onclick="savePay()">Save Payout & Payment</button></div>`;$('plead').onchange=()=>payFill();payFill()}function payFill(){let o=$('plead').selectedOptions[0];$('pamount').value=o?.dataset.amount||0;$('pconnector').value=o?.dataset.con||''}async function savePay(){await api('/payments',{method:'POST',body:JSON.stringify({lead_id:$('plead').value,connector:$('pconnector').value,payout_percent:+$('ppercent').value||0,payment_date:$('pdate').value,payment_mode:$('pmode').value,utr:$('putr').value,payment_status:$('pstatus').value})});alert('Payment saved');historyPage()}async function historyPage(){let a=await api('/payments');$('view').innerHTML=`<div class="card"><h3>Payout History</h3><table><thead><tr><th>Customer</th><th>Connector</th><th>%</th><th>Net Payout</th><th>Date</th><th>Mode</th><th>UTR</th><th>Status</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.customer||'')}</td><td>${esc(x.connector)}</td><td>${x.payout_percent}%</td><td>${money(x.net_payout)}</td><td>${x.payment_date||'-'}</td><td>${x.payment_mode}</td><td>${esc(x.utr)}</td><td><span class="badge">${x.payment_status}</span></td></tr>`).join('')}</tbody></table></div>`}const history=historyPage;async function connectors(){let a=await api('/leads');let m={};a.forEach(x=>{let c=x.connector||'Unassigned';m[c]=(m[c]||0)+1});$('view').innerHTML=`<div class="card"><h3>Connectors</h3><table><thead><tr><th>Connector</th><th>Total Leads</th><th>Disbursed</th></tr></thead><tbody>${Object.entries(m).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td><td>${a.filter(x=>(x.connector||'Unassigned')===k&&x.status==='Disbursed').length}</td></tr>`).join('')}</tbody></table></div>`}function users(){$('view').innerHTML=`<div class="card"><h3>Users</h3><table><tr><th>Name</th><th>Role</th><th>Mobile</th><th>Status</th></tr><tr><td>Rohit Mohite</td><td>Admin</td><td>7972048818</td><td><span class="badge">Active</span></td></tr></table></div>`}async function reports(){let d=await api('/dashboard');$('view').innerHTML=`<div class="grid"><div class="card"><h3>Lead Report</h3><p>Total Leads: <b>${d.total}</b></p><p>Login: <b>${d.counts.Login}</b></p><p>Sanction: <b>${d.counts.Sanction}</b></p><p>Disbursed: <b>${d.counts.Disbursed}</b></p><p>Rejected: <b>${d.counts.Rejected}</b></p></div><div class="card"><h3>Financial Report</h3><p>Total Disbursement: <b>${money(d.disbursement)}</b></p><p>Total Payout: <b>${money(d.payout)}</b></p><p>Pending Payments: <b>${d.pending}</b></p></div></div>`}function settings(){$('view').innerHTML=`<div class="card"><h3>Settings</h3><div class="form"><label>CRM Name<input value="Loan CRM"></label><label>Currency<input value="INR (₹)"></label><label>Default Payout Status<select><option>Pending</option><option>Paid</option></select></label></div><button class="btn" onclick="alert('Settings saved')">Save Settings</button></div>`}async function profile(){let d=await api('/me');$('view').innerHTML=`<div class="card"><h3>Profile</h3><div class="form"><label>Name<input value="Rohit Mohite"></label><label>Role<input value="Admin" readonly></label><label>Mobile<input value="${d.mobile}" readonly></label></div><button class="btn" onclick="alert('Profile saved')">Save Profile</button></div>`}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');dashboard()}if(token)start();</script></body></html>
