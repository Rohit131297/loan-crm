<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan CRM Reports</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9;color:#1f2937}header{background:#17365d;color:#fff;padding:18px;font-size:22px;font-weight:700}main{max-width:1200px;margin:auto;padding:20px}.box{background:#fff;padding:18px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 8px #0001}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:#fff;padding:16px;border-radius:10px}.card b{font-size:22px;display:block;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}button{padding:10px 14px;background:#17365d;color:#fff;border:0;border-radius:6px;cursor:pointer;margin:4px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}h2{margin-top:0}.error{color:#b91c1c}</style></head><body><header>Rohit Mohite – Loan CRM Reports</header><main><div class="box"><button onclick="location.href='/'">← Back to CRM</button><button onclick="load()">Refresh</button><button onclick="exportLeads()">Export Leads CSV</button><button onclick="exportPayments()">Export Payments CSV</button><p id="msg"></p></div><div class="cards"><div class="card">Total Leads<b id="total">0</b></div><div class="card">New<b id="newc">0</b></div><div class="card">Login<b id="loginc">0</b></div><div class="card">Sanction<b id="sanc">0</b></div><div class="card">Disbursed<b id="disb">0</b></div><div class="card">Rejected<b id="rej">0</b></div><div class="card">Loan Amount<b id="loan">₹0</b></div><div class="card">Disbursement<b id="disba">₹0</b></div><div class="card">Payout<b id="payout">₹0</b></div><div class="card">Pending Payments<b id="pending">0</b></div></div><div class="box"><h2>Sales Executive-wise Performance</h2><table><thead><tr><th>Sales Executive</th><th>Leads</th><th>Sanction</th><th>Disbursed</th><th>Disbursement</th></tr></thead><tbody id="salesRows"></tbody></table></div><div class="box"><h2>Bank-wise Report</h2><table><thead><tr><th>Bank</th><th>Leads</th><th>Sanction</th><th>Disbursed</th><th>Disbursement</th></tr></thead><tbody id="bankRows"></tbody></table></div></main><script>const token=localStorage.getItem('crm_token')||'';const $=id=>document.getElementById(id);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});async function api(path){const r=await fetch('/api'+path,{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function csv(rows){if(!rows.length)return '';const keys=Object.keys(rows[0]);const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return [keys.join(','),...rows.map(r=>keys.map(k=>esc(r[k])).join(','))].join('\n')}function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}let leads=[],payments=[];function exportLeads(){if(leads.length)download('loan-crm-leads.csv',csv(leads));}function exportPayments(){if(payments.length)download('loan-crm-payments.csv',csv(payments));}function group(rows,key){const m={};for(const x of rows){const k=x[key]||'Unassigned';m[k]??={name:k,leads:0,sanction:0,disbursed:0,disb:0};m[k].leads++;if(x.status==='Sanction')m[k].sanction++;if(x.status==='Disbursed'){m[k].disbursed++;m[k].disb+=Number(x.disb||0)}}return Object.values(m).sort((a,b)=>b.leads-a.leads)}function renderGroup(id,data){$(id).innerHTML=data.map(x=>`<tr><td>${safe(x.name)}</td><td>${x.leads}</td><td>${x.sanction}</td><td>${x.disbursed}</td><td>${money(x.disb)}</td></tr>`).join('')||'<tr><td colspan="5">No data</td></tr>'}function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{if(!token)throw Error('Please login to CRM first');leads=await api('/leads');payments=await api('/payments');const c={New:0,Login:0,Sanction:0,Disbursed:0,Rejected:0};let loan=0,disb=0;for(const x of leads){c[x.status]=(c[x.status]||0)+1;loan+=Number(x.loan_amount||0);disb+=Number(x.disb||0)}const payout=payments.reduce((s,x)=>s+Number(x.net_payout||0),0),pending=payments.filter(x=>x.payment_status!=='Paid').length;$('total').textContent=leads.length;$('newc').textContent=c.New;$('loginc').textContent=c.Login;$('sanc').textContent=c.Sanction;$('disb').textContent=c.Disbursed;$('rej').textContent=c.Rejected;$('loan').textContent=money(loan);$('disba').textContent=money(disb);$('payout').textContent=money(payout);$('pending').textContent=pending;renderGroup('salesRows',group(leads,'assigned_to'));renderGroup('bankRows',group(leads,'bank'));$('msg').textContent='Report updated successfully.'}catch(e){$('msg').className='error';$('msg').textContent=e.message}}load();</script></body></html>
